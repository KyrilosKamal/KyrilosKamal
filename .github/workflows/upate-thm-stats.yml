
name: Update TryHackMe Stats

on:
  schedule:
    # Run daily at 00:15 UTC
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and validate TryHackMe stats
        env:
          THM_USERNAME: Hackth3Path
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          username = os.environ["THM_USERNAME"]
          url = (
              "https://tryhackme.com/api/v2/public-profile"
              f"?username={username}"
          )

          output = Path("assets/thm-stats.json")

          request = urllib.request.Request(
              url,
              headers={"Accept": "application/json",
                       "User-Agent": "GitHub-Actions-THM-Stats"}
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 200:
                  raise RuntimeError(
                      f"TryHackMe returned HTTP {response.status}"
                  )
              payload = json.loads(response.read().decode("utf-8"))

          if payload.get("status") != "success":
              raise RuntimeError("Invalid TryHackMe API status")

          profile = payload.get("data", {})

          if profile.get("username") != username:
              raise RuntimeError("Unexpected TryHackMe username")

          fields = [
              "rank",
              "topPercentage",
              "level",
              "completedRoomsNumber",
              "totalPoints",
              "streak",
              "largestStreak",
              "badgesNumber",
          ]

          stats = {}
          for field in fields:
              value = profile.get(field)
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  raise RuntimeError(f"Invalid or missing field: {field}")
              stats[field] = value

          if stats["rank"] < 1:
              raise RuntimeError("Invalid global rank")

          data = {
              "schemaVersion": 1,
              "username": username,
              **stats,
              "updatedAt": datetime.now(timezone.utc).isoformat(
                  timespec="seconds"
              ).replace("+00:00", "Z"),
          }

          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8"
          )

          print("TryHackMe stats updated successfully.")
          print(json.dumps(data, indent=2))
          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/thm-stats.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update TryHackMe stats"
            git push
          fi
